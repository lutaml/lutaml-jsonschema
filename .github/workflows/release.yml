name: release

permissions:
  contents: write
  packages: write
  id-token: write
  # the reusable's release job creates and merges the release PR
  # (pull-requests: write at its job level, metanorma/ci 36b806d9);
  # a caller whose permissions block omits pull-requests cannot honor
  # that ceiling and the call startup-fails at graph build — this stub
  # has been failing since that redesign landed (last success 11-03,
  # first failure 11-25) while stubs with no permissions block
  # (repo-default write) kept working
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch or pre|rc|etc
        required: true
        default: "skip"
  repository_dispatch:
    types: [do-release]

jobs:
  release:
    uses: metanorma/ci/.github/workflows/rubygems-release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version }}
      # The SPA dist must exist in the working tree when the gem is
      # built; pre_build_command runs in the OIDC publish step right
      # before gem build. The subshell keeps the step's cwd at the repo
      # root — a bare `cd frontend` persists into the gem-build step,
      # which then finds no *.gemspec (0.1.30's first publish attempt
      # died there). post_install cannot carry this: a stub that binds
      # a post_install string startup-fails the reusable's graph build
      # (metanorma/ci#531 lineage).
      pre_build_command: '(cd frontend && npm install --package-lock-only && npm ci && npm run build && git checkout -- package-lock.json)'
    secrets:
      # rubygems-api-key is deliberately NOT passed: the
      # LUTAML_CI_RUBYGEMS_API_KEY secret does not exist on this
      # repository (publication rides Trusted Publishing via the
      # reusable's OIDC path), and binding an empty secret value
      # startup-fails the reusable's graph build — the same
      # empty-string class as ci#531's input fix
      pat_token: ${{ secrets.GITHUB_TOKEN }}
